apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-frontend
  namespace: my-gitops-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # CodePipeline will update this via sed
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/observability-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: my-gitops-app
  labels:
    app: frontend
spec:
  selector:
    app: frontend ports:
    - protocol: TCP
      port: 80
      targetPort: 80